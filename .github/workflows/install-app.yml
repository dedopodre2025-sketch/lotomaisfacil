name: Install Loto Mais Facil

on:
  push:
    paths:
      - '.github/workflows/install-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild package
        shell: bash
        run: |
          cat .upload/part*.b64 > /tmp/app.b64
          base64 -d /tmp/app.b64 > /tmp/app.zip
          echo "c4e60c240311884c514ae193c2291ebaa6beb34232935ce208a4518e44588cb1  /tmp/app.zip" | sha256sum -c -
          unzip -o /tmp/app.zip -d .
          rm -rf .upload

      - name: Commit app files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Instala Loto Mais Fácil v5.2"
            git push
          fi
